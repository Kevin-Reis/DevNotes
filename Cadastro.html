<!doctype html>
<html lang="pt-br">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastre-Se</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body style="background-color: #6f42c1;">

    <div class="Base">

        <nav class="navbar shadow-sm mb-5">
            <div class="container">
                <span class="navbar-brand fw-bold">DevNotes</span>
    
                <a class="btn-roxo" href="Cadastro.html">
                    <span style="font-family: Arial, Helvetica, sans-serif;">Conecte-se</span>
    
                </a>
    
            </div>
        </nav>




        <div class="d-flex justify-content-center">
            <div class="formulario">
                <div class="tituloCad">
                    <h3 style="text-align: center; color: white;">CADASTRE-SE</h3>

                </div>
                
                <div class="d-flex justify-content-center">
                    <div class="inputs row g-3">
                        <input class="inputsForm" id="nome" placeholder="Nome" type="text">
                        <span style="color: red;" id="erroNome"></span>

                        <input class="inputsForm" id="email" placeholder="Email" type="text">
                        <span style="color: red;" id="erroEmail"></span>

                        <input class="inputsForm" id="senha" placeholder="Senha" type="text">
                        <span style="color: red;"  id="erroSenha"></span>

                    </div>
                    
                </div>

                <div class="d-flex justify-content-center">
                    <button id="btn-cadastrar" class="btn-roxo">CADASTRAR</button>

                </div>
                
                <div class="d-flex justify-content-center m-2">

                    <a href="login.html">

                        <button class="btn-roxo">JA TENHO UMA CONTA</button>

                    </a>
                </div>
                
            </div>
        </div>


    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
