<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevNotes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>

    <nav class="navbar shadow-sm mb-5">
        <div class="container">
            <span class="navbar-brand fw-bold">DevNotes</span>
            <span id="nomeLogado"></span>
            <button class="btn-roxo" id="btn-logout">SAIR</button>
            
            <a class="btn-roxo"  id="btn-conectar" href="Cadastro.html">
                <span>Conecte-se</span>
            </a>
            
        </div>
    </nav>

    <div class="d-flex justify-content-center m-3">
        <p>Você tem <span id="contador-notas">0</span> nota(s)</p>

    </div>

    
    <div class="d-flex justify-content-center m-3">

        <input class="inputPesquisa" type="text" id="inputBusca">

    </div>

    <div class="d-flex justify-content-center ">
        <select id="selectOrdenacao" class="form-select" style="width: auto; border: solid 0.2rem #6f42c1;">
            <option value="recentes">Mais recentes</option>
            <option value="antigas">Mais antigas</option>
            <option value="alfabetica">Ordem Alfabética (A-Z)</option>
        </select>

    </div>
    
    <div class=" d-flex justify-content-center m-3">

        <div class="filtro">
            <button class="btn-roxo" id="filtroTodos">Todos</button>
            <button class="btn-roxo" id="filtroPessoal">Pessoal</button>
            <button class="btn-roxo" id="filtroTrabalho">Trabalho</button>
            <button class="btn-roxo" id="filtroEstudos">Estudos</button>
        </div>

    </div>
    


    <div class="container">
        <div class="row g-4" id="lista-notas">
            <p class="text-center text-muted mt-5">Nenhuma nota criada ainda...</p>
        </div>
    </div>

    <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja apagar esta nota? Esta ação não pode ser desfeita.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarExclusao">Excluir Nota</button>
                </div>
            </div>
        </div>
    </div>

    <button id="btn-abrir" class="btn btn-lg position-fixed bottom-0 end-0 m-3 btn-roxo">
        +
    </button>

    <div class="modal fade" id="blocoNotas" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 style="color: #6f42c1;" class="modal-title">Bloco de Nota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Título</strong> </p>
                    <input id="inputTitulo" class="inputsNotas" type="text" placeholder="Digite o título da nota...">
                    <span id="contadorTitulo">0 caracteres</span>
                    <span style="color: red;" id="erroTitulo"></span>

                    <div style="margin-top: 3rem;">
                        <p><strong>Conteúdo</strong></p>
                        <textarea id="inputConteudo" class="inputsNotas"
                            placeholder="Digite o conteúdo da nota...">
                        </textarea>
                        <span id="contadorConteudo">0 caracteres</span>
                        <span style="color: red;" id="erroConteudo"></span>

                    </div>
                    <div style="margin-top: 2rem;">
                        <p><strong>Categoria</strong></p>
                        <select class="form-select inputsNotas" id="inputCategoria"
                            style="border: 1px solid #6f42c1; border-radius: 8px; padding: 0.5rem;">
                            <option value="Pessoal">Pessoal </option>
                            <option value="Trabalho">Trabalho </option>
                            <option value="Estudos">Estudos </option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-vermelho"
                            data-bs-dismiss="modal">Fechar</button>
                        <button id="btn-salvar" type="button" class="btn btn-primary btn-roxo">Salvar Nota</button>
                    </div>
                </div>


            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js" ></script>
</body>

</html>
